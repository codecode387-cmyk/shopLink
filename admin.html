<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – ShopLink NG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.adm{max-width:960px;margin:0 auto;padding:1rem 0 3rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1rem 0}
.stats div{border:1px solid #0001;border-radius:14px;padding:1rem}
.stats strong{display:block;font:800 1.8rem/1.1 "Bricolage Grotesque",sans-serif}
.stats span{color:var(--muted);font-size:.9rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid #0001;font-size:.95rem}
.tag{font-weight:700}.tag.ok{color:#0b5a26}.tag.bad{color:#9b1c1c}
#q{max-width:320px;margin:.5rem 0}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">ShopLink <small>NG</small></a>
<nav class="links"><a href="dashboard.html">My dashboard</a><a href="#" id="out">Log out</a></nav></div></header>
<main><div class="wrap adm">
  <h1>Admin</h1>
  <p class="msg" id="msg" role="alert"></p>
  <div class="stats" id="stats"></div>
  <label class="field" style="max-width:320px">Search stores<input id="q" placeholder="Store name, link or number"></label>
  <div class="tw"><table>
    <thead><tr><th>Store</th><th>WhatsApp</th><th>Joined</th><th>Paid until</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
(function () {
  var sb = window.supabase.createClient("https://grrotfpoalxvkkrkgzpg.supabase.co", "sb_publishable_rHcD1gDpdwT5jT1CscnGGA_2rV8baSw");
  var $ = function (id) { return document.getElementById(id); }, all = [];
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function day(d) { return new Date(d).toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" }); }

  function draw() {
    var q = $("q").value.toLowerCase().trim();
    $("rows").innerHTML = all.filter(function (v) {
      return !q || [v.store_name, v.slug, v.whatsapp_number].join(" ").toLowerCase().indexOf(q) > -1;
    }).map(function (v) {
      var open = new Date(v.paid_until) > new Date();
      return "<tr><td><b>" + esc(v.store_name) + "</b><br><small>shoplink.ng/" + esc(v.slug) + "</small></td><td>" + esc(v.whatsapp_number) +
        "</td><td>" + day(v.created_at) + "</td><td>" + day(v.paid_until) + '</td><td class="tag ' + (open ? "ok" : "bad") + '">' + (open ? "Open" : "Closed") + "</td></tr>";
    }).join("") || '<tr><td colspan="5" style="color:var(--muted)">No stores found.</td></tr>';
  }
  $("q").addEventListener("input", draw);
  $("out").addEventListener("click", function (e) { e.preventDefault(); sb.auth.signOut().then(function () { location.href = "login.html"; }); });

  sb.auth.getSession().then(function (r) {
    if (!r.data.session) { location.href = "login.html"; return; }
    sb.rpc("admin_stats").then(function (s) {
      if (s.error) { location.href = "dashboard.html"; return; }
      var d = s.data, items = [["Total stores", d.total], ["Open stores", d.active], ["Closed stores", d.closed], ["Joined this month", d.new_month], ["Products listed", d.products], ["Revenue", "₦" + Number(d.revenue).toLocaleString("en-NG")]];
      $("stats").innerHTML = items.map(function (i) { return "<div><strong>" + i[1] + "</strong><span>" + i[0] + "</span></div>"; }).join("");
      sb.from("vendors").select("store_name,slug,whatsapp_number,created_at,paid_until").order("created_at", { ascending: false }).then(function (v) {
        if (v.error) { $("msg").textContent = "Could not load stores."; return; }
        all = v.data; draw();
      });
    });
  });
})();
</script>
</body>
</html>
