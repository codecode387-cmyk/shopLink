<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advertise on ShopLink NG</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="nav.js" defer></script>
<script src="live.js" defer></script>
<style>
.pick{display:block;margin-top:.7rem;padding:.9rem 1rem;border:1.5px solid var(--line);border-radius:14px;background:var(--white);cursor:pointer}
.pick:has(input:checked){border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,var(--white))}
.pick input{margin-right:.6rem;accent-color:var(--leaf)}
.pick small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.chips button{min-height:44px;padding:0 .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink);font:700 .92rem var(--body);cursor:pointer}
.chips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chips button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.stp{margin:1.6rem 0 .2rem;font-size:1.25rem}
.pill{display:inline-block;padding:.15rem .65rem;border-radius:999px;font-size:.78rem;font-weight:700;background:#fff7e0;color:#7a5a00}
.pill.ok{background:#e8f6ee;color:#0f5a32}.pill.bad{background:#fdecea;color:#9b2318}
.okmsg{color:var(--leaf)}
</style>
</head><body>
<header><div class="wrap nav"><a class="logo" href="index.html" aria-label="ShopLink NG home"><img src="logo-icon.png" alt="" width="36" height="36" style="width:36px;height:36px;border-radius:9px;display:block"> ShopLink <small>NG</small></a><button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu"><span></span></button><nav class="links" id="menu" aria-label="Main"><a href="how-it-works.html">How it works</a><a href="mega.html">Mega Store</a><a href="login.html">Log in</a><a class="btn btn-main btn-sm" href="signup.html">Create your store</a></nav></div></header>
<main><div class="wrap" style="max-width:700px;padding:2rem 0 3rem">
<h1 style="font-size:clamp(1.8rem,5vw,2.6rem)">Advertise your business</h1>
<p style="color:var(--muted);margin-top:.6rem">Pick a package. Your request opens on WhatsApp and goes straight to us. We confirm and pay-to-start details there.</p>
<form id="ad" novalidate>
<div id="pk"></div>
<label class="field">Your store name<input id="a_store" maxlength="60"></label>
<label class="field">Your store link<input id="a_link" placeholder="shoplinkng.shop/your-store"></label>
<label class="field">How many weeks?<input id="a_weeks" type="number" inputmode="numeric" min="1" max="12" value="1"></label>
<p style="font-weight:700;margin-top:1rem" id="tot"></p>
<p class="msg" id="a_msg" role="alert"></p>
<button class="btn btn-main" type="submit" style="margin-top:1rem;width:100%">Send request on WhatsApp</button>
</form></div></main>
<footer><div class="wrap"><span>© <span id="yr">2026</span> ShopLink NG. Made in Nigeria.</span><nav aria-label="Footer"><a href="about.html">About</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="contact.html">Contact</a></nav></div></footer>
<script>
(function () {
  /* EDIT YOUR PRICES HERE (naira per week) */
  var PACKAGES = [
    { name: "Featured Store", price: 5000, what: "Your store appears in the Featured stores row on the Mega Store." },
    { name: "Product Spotlight", price: 3000, what: "Up to 3 chosen products promoted to shoppers." },
    { name: "Social Media Boost", price: 4000, what: "Your products featured on ShopLink NG's social media pages." },
    { name: "Business of the Week", price: 10000, what: "A dedicated promotion of your business." },
    { name: "Sponsored Listing", price: 2000, what: "Higher position for your products in their category on the Mega Store." }
  ];
  var ADS_WHATSAPP = "2349032473005", $ = function (id) { return document.getElementById(id); }, sel = 0;
  function naira(n) { return "₦" + Number(n).toLocaleString("en-NG"); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  $("pk").innerHTML = PACKAGES.map(function (p, i) {
    return '<label class="pick"><input type="radio" name="pk" value="' + i + '"' + (i === 0 ? " checked" : "") + "><b>" + esc(p.name) + "</b> · " + naira(p.price) + " per week<small>" + esc(p.what) + "</small></label>";
  }).join("");
  function total() { var w = parseInt($("a_weeks").value, 10) || 0; $("tot").textContent = w > 0 ? "Total: " + naira(PACKAGES[sel].price * w) : ""; }
  $("pk").addEventListener("change", function (e) { sel = +e.target.value; total(); });
  $("a_weeks").addEventListener("input", total); total();
  $("ad").addEventListener("submit", function (e) {
    e.preventDefault(); var m = $("a_msg"); m.textContent = "";
    var w = parseInt($("a_weeks").value, 10), store = $("a_store").value.trim();
    if (store.length < 2) { m.textContent = "Enter your store name."; return; }
    if (isNaN(w) || w < 1 || w > 12) { m.textContent = "Enter a number of weeks from 1 to 12."; return; }
    var p = PACKAGES[sel], text = "Hello ShopLink NG, I want to advertise.\nPackage: " + p.name + "\nStore: " + store + "\nLink: " + ($("a_link").value.trim() || "-") + "\nWeeks: " + w + "\nTotal: " + naira(p.price * w);
    window.open("https://wa.me/" + ADS_WHATSAPP + "?text=" + encodeURIComponent(text), "_blank", "noopener");
  });
})();
</script>
</body></html>
