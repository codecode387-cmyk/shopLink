<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard – ShopLink NG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="menu.js" defer></script>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">ShopLink <small>NG</small></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu"><span></span></button>
    <nav class="links" id="menu" aria-label="Main">
      <a id="storeLink" href="#">View my store</a>
      <a href="#" id="out">Log out</a>
    </nav>
  </div>
</header>
<main><div class="wrap dash">
  <h1 id="hi">Your dashboard</h1>

  <div id="status" class="status" role="status"></div>

  <section class="card">
    <h2>Pay for your store</h2>
    <p class="sub">₦1,000 a month. Each payment adds 30 days. If your time runs out, your store shows "Store closed" until you pay again.</p>
    <button class="btn btn-main" id="pay" type="button" style="margin-top:.8rem">Pay ₦1,000</button>
    <p class="msg" id="payMsg" role="alert"></p>
  </section>

  <form class="card" id="biz" novalidate>
    <h2>About your business</h2>
    <label class="field">Store name<input id="store_name" maxlength="50"></label>
    <label class="field">What do you sell?<textarea id="description" rows="3" maxlength="300" placeholder="Handmade bags, delivered across Lagos"></textarea></label>
    <div class="row">
      <label class="field">City<input id="city" maxlength="40" placeholder="Lagos"></label>
      <label class="field">WhatsApp number<input id="whatsapp_number" type="tel" inputmode="tel" placeholder="0903 247 3005"></label>
    </div>
    <p class="linkbox" id="url"></p>
    <p class="msg" id="bizMsg" role="alert"></p>
    <button class="btn btn-main" type="submit">Save changes</button>
  </form>

  <form class="card" id="prod" novalidate>
    <h2>Add a product</h2>
    <label class="field">Product name<input id="p_name" maxlength="80"></label>
    <div class="row">
      <label class="field">Price in naira<input id="p_price" type="number" inputmode="numeric" min="0"></label>
      <label class="field">Photo<input id="p_img" type="file" accept="image/*"></label>
    </div>
    <label class="field">Description<textarea id="p_desc" rows="2" maxlength="300"></textarea></label>
    <p class="msg" id="pMsg" role="alert"></p>
    <button class="btn btn-main" type="submit">Add product</button>
    <ul class="plist" id="plist"></ul>
  </form>
</div></main>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
(function () {
  var sb = window.supabase.createClient("https://grrotfpoalxvkkrkgzpg.supabase.co", "sb_publishable_rHcD1gDpdwT5jT1CscnGGA_2rV8baSw");
  var PAYSTACK_KEY = "pk_live_383a0e2b83c984d24a655080a848924537c4f3bc";
  var $ = function (id) { return document.getElementById(id); };
  var user, vendor;

  function normPhone(v) { var d = v.replace(/\D/g, ""); if (d.indexOf("234") === 0) return d; if (d.charAt(0) === "0") return "234" + d.slice(1); return d.length === 10 ? "234" + d : d; }
  function naira(n) { return "₦" + Number(n).toLocaleString("en-NG"); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

  function showStatus() {
    var left = Math.ceil((new Date(vendor.paid_until) - new Date()) / 864e5), s = $("status");
    if (left > 0) { s.className = "status ok"; s.textContent = "Your store is open. " + left + (left === 1 ? " day" : " days") + " left."; }
    else { s.className = "status bad"; s.textContent = "Your store is closed. Pay ₦1,000 to reopen it."; }
  }

  function fill() {
    $("hi").textContent = vendor.store_name || "Your dashboard";
    ["store_name", "description", "city"].forEach(function (k) { $(k).value = vendor[k] || ""; });
    $("whatsapp_number").value = vendor.whatsapp_number || "";
    var u = "shoplink.ng/" + vendor.slug;
    $("url").textContent = "Your store link: " + u;
    $("storeLink").href = "store.html?s=" + encodeURIComponent(vendor.slug);
    showStatus();
  }

  function loadProducts() {
    sb.from("products").select("*").eq("owner_id", user.id).order("created_at", { ascending: false }).then(function (r) {
      var ul = $("plist"); ul.innerHTML = "";
      (r.data || []).forEach(function (p) {
        var li = document.createElement("li");
        li.innerHTML = (p.image_url ? '<img alt="" src="' + esc(p.image_url) + '">' : '<img alt="">') +
          '<span class="grow"><b>' + esc(p.name) + '</b>' + naira(p.price) + '</span><button type="button" class="btn btn-ghost btn-sm">Delete</button>';
        li.querySelector("button").onclick = function () {
          if (confirm("Delete " + p.name + "?")) sb.from("products").delete().eq("id", p.id).then(loadProducts);
        };
        ul.appendChild(li);
      });
      if (!ul.children.length) ul.innerHTML = '<li class="empty">No products yet. Add your first one above.</li>';
    });
  }

  $("biz").addEventListener("submit", function (e) {
    e.preventDefault(); $("bizMsg").textContent = "";
    var wa = normPhone($("whatsapp_number").value);
    if ($("store_name").value.trim().length < 2) { $("bizMsg").textContent = "Enter your store name."; return; }
    if (!/^234[789][01]\d{8}$/.test(wa)) { $("bizMsg").textContent = "Enter a valid Nigerian WhatsApp number."; return; }
    sb.from("vendors").update({ store_name: $("store_name").value.trim(), description: $("description").value.trim(), city: $("city").value.trim(), whatsapp_number: wa })
      .eq("owner_id", user.id).select().single().then(function (r) {
        if (r.error) { $("bizMsg").textContent = "Could not save. Try again."; return; }
        vendor = r.data; fill(); $("bizMsg").textContent = "Saved.";
      });
  });

  $("prod").addEventListener("submit", function (e) {
    e.preventDefault(); var m = $("pMsg"); m.textContent = "";
    var name = $("p_name").value.trim(), price = parseFloat($("p_price").value), f = $("p_img").files[0];
    if (!name) { m.textContent = "Enter the product name."; return; }
    if (isNaN(price) || price < 0) { m.textContent = "Enter a price in naira."; return; }
    if (f && f.size > 3e6) { m.textContent = "Photo must be under 3 MB."; return; }
    function insert(url) {
      sb.from("products").insert({ owner_id: user.id, name: name, price: price, description: $("p_desc").value.trim(), image_url: url }).then(function (r) {
        if (r.error) { m.textContent = "Could not add the product. Try again."; return; }
        $("prod").reset(); loadProducts();
      });
    }
    if (!f) return insert(null);
    var path = user.id + "/" + Date.now() + "-" + f.name.replace(/[^a-z0-9.]/gi, "_");
    sb.storage.from("products").upload(path, f).then(function (r) {
      if (r.error) { m.textContent = "Photo upload failed. Try again."; return; }
      insert(sb.storage.from("products").getPublicUrl(path).data.publicUrl);
    });
  });

  $("pay").addEventListener("click", function () {
    var m = $("payMsg"); m.textContent = "";
    if (!window.PaystackPop) { m.textContent = "Payment could not load. Check your connection and refresh."; return; }
    PaystackPop.setup({
      key: PAYSTACK_KEY, email: user.email, amount: 100000, currency: "NGN",
      ref: "SL" + Date.now() + Math.floor(Math.random() * 1e5),
      metadata: { owner_id: user.id },
      callback: function (res) {
        m.textContent = "Confirming your payment…";
        sb.functions.invoke("verify-payment", { body: { reference: res.reference } }).then(function (r) {
          if (r.error) { m.textContent = "Payment received but not confirmed yet. Contact us on WhatsApp with reference " + res.reference; return; }
          return sb.from("vendors").select("*").eq("owner_id", user.id).single().then(function (q) { vendor = q.data; showStatus(); m.textContent = "Payment confirmed. Thank you."; });
        });
      },
      onClose: function () {}
    }).openIframe();
  });

  $("out").addEventListener("click", function (e) { e.preventDefault(); sb.auth.signOut().then(function () { location.href = "login.html"; }); });

  sb.auth.getSession().then(function (r) {
    if (!r.data.session) { location.href = "login.html"; return; }
    user = r.data.session.user;
    sb.from("vendors").select("*").eq("owner_id", user.id).maybeSingle().then(function (q) {
      if (!q.data) { $("status").className = "status bad"; $("status").textContent = "We could not find your store. Contact us on WhatsApp."; return; }
      vendor = q.data; fill(); loadProducts();
    });
  });
})();
</script>
</body>
</html>
