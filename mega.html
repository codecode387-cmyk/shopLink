<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopLink Mega Store – Shop from sellers across Nigeria</title>
<meta name="description" content="Browse products from sellers across Nigeria in one place and order straight on WhatsApp. ShopLink Mega Store by ShopLink NG.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#1b7a4b">
<link rel="canonical" href="https://shoplinkng.shop/mega">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ShopLink NG">
<meta property="og:title" content="ShopLink Mega Store">
<meta property="og:description" content="Browse products from sellers across Nigeria and order straight on WhatsApp.">
<meta property="og:image" content="https://shoplinkng.shop/og-image.jpg">
<meta property="og:url" content="https://shoplinkng.shop/mega">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{--g:#1b7a4b;--gd:#145c38;--wa:#25d366;--ink:#14231b;--mut:#64748b;--line:#e5e9ee;--soft:#f1f4f2}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.55 "DM Sans",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;border:0;border-radius:12px;touch-action:manipulation;color:inherit;background:none}
.w{width:min(1100px,92%);margin-inline:auto}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 80% 0%,#26a066 0%,#1b7a4b 45%,#0d3f27 100%);padding:calc(1.2rem + env(safe-area-inset-top,0px)) 0 1.6rem}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{width:240px;height:240px;top:-90px;left:-70px}
.hero:after{width:300px;height:300px;bottom:-150px;right:-80px}
.hero .w{position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif}
.logo em{font-style:normal;color:#a9f0c9}
.sell{display:inline-flex;align-items:center;min-height:40px;padding:0 1rem;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);font-size:.85rem;font-weight:700}
.hero h1{font-size:clamp(1.9rem,7vw,3rem);line-height:1.08;margin-top:1.4rem}
.hero p{margin-top:.5rem;max-width:34rem;color:rgba(255,255,255,.88)}

/* search */
.sbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:calc(.6rem + env(safe-area-inset-top,0px)) 0 .6rem;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:.6rem;height:46px;padding:0 .8rem;background:var(--soft);border:1.5px solid transparent;border-radius:14px}
.search:focus-within{border-color:var(--g);background:#fff}
.search>svg{width:20px;height:20px;flex:none;color:var(--mut)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-family:inherit;font-size:1rem;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qx{width:28px;height:28px;flex:none;border-radius:50%;background:#c5cdd6;color:#fff;font-size:1.1rem;line-height:1;display:grid;place-items:center}

/* grid */
.st{color:var(--mut);margin:1.1rem 0 .2rem;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:.6rem}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem}}
.mc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;transition:transform .15s,box-shadow .15s}
.mc:active{transform:scale(.985)}
@media(hover:hover){.mc:hover{box-shadow:0 8px 24px rgba(20,35,27,.1);transform:translateY(-2px)}}
.mi{display:block;aspect-ratio:1;background:var(--soft)}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.ph2{width:100%;height:100%;display:grid;place-items:center;font:800 2.2rem "Bricolage Grotesque";color:#7fae94;background:#e8f6ee}
.mb{display:flex;flex-direction:column;gap:.2rem;padding:.65rem .65rem .75rem;flex:1}
.mn{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mp{font-weight:800;color:var(--g);font-size:1.05rem}
.ms{display:flex;align-items:center;gap:.4rem;margin-top:auto;padding-top:.45rem;color:var(--mut);font-size:.82rem;min-width:0}
.ms img,.ms .sl{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none;background:#e8f6ee;color:var(--g);font:800 .72rem "Bricolage Grotesque";display:grid;place-items:center}
.ms span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ms i{font-style:normal;color:#f5a623;flex:none}
.more{display:block;margin:1.6rem auto 0;min-height:46px;padding:0 1.6rem;background:var(--soft);border:1.5px solid var(--g);color:var(--g)}
.more:active{background:#e8f6ee}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--mut)}
.empty h2{color:var(--ink);font-size:1.4rem;margin-bottom:.4rem}
.empty a{display:inline-block;margin-top:1rem;background:var(--g);color:#fff;padding:.7rem 1.3rem;border-radius:12px;font-weight:700}
.foot{text-align:center;color:var(--mut);font-size:.85rem;padding:2.5rem 0 calc(2rem + env(safe-area-inset-bottom,0px))}
.foot a{color:var(--g);font-weight:700}

/* ---------- splash loader ---------- */
body.loading{overflow:hidden}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 38%,#26a066 0%,#1b7a4b 45%,#0d3f27 100%);
  transition:opacity .55s ease,transform .7s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
#splash .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(2px);animation:float 7s ease-in-out infinite}
#splash .b1{width:260px;height:260px;top:-70px;left:-60px}
#splash .b2{width:340px;height:340px;bottom:-120px;right:-90px;animation-delay:-3s}
#splash .b3{width:120px;height:120px;top:62%;left:12%;animation-delay:-5s}
@keyframes float{50%{transform:translate(18px,-22px) scale(1.08)}}
.sp-in{position:relative;text-align:center;padding:1rem}
.sp-logo{position:relative;width:104px;height:104px;margin:0 auto 1.3rem;display:grid;place-items:center;border-radius:30px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo:before,.sp-logo:after{content:"";position:absolute;inset:-2px;border-radius:32px;border:2px solid rgba(255,255,255,.55);animation:ring 2s ease-out infinite}
.sp-logo:after{animation-delay:1s}
.sp-logo svg{width:58px;height:58px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sp-logo path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .25s ease forwards}
.sp-logo path+path{animation-delay:.6s}
.sp-logo path+path+path{animation-delay:.9s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.sp-word{font:800 clamp(1.9rem,8.5vw,2.6rem)/1 "Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-.02em;display:flex;justify-content:center;flex-wrap:wrap}
.sp-word span{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .6s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:calc(.5s + var(--i)*.05s)}
.sp-word em{font-style:normal;color:#a9f0c9;margin-left:.3em;display:inline-flex}
@keyframes rise{to{opacity:1;transform:none}}
.sp-tag{margin-top:.7rem;font-size:.95rem;opacity:0;animation:fade .6s 1.3s forwards;color:rgba(255,255,255,.85)}
@keyframes fade{to{opacity:1}}
.sp-bar{width:150px;height:4px;margin:1.6rem auto 0;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.sp-bar:after{content:"";display:block;height:100%;width:40%;border-radius:99px;background:#fff;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media(prefers-reduced-motion:reduce){#splash *,#splash *:before,#splash *:after{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body class="loading">

<div id="splash" role="status" aria-label="Loading the Mega Store">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="sp-in">
    <div class="sp-logo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path pathLength="1" d="M14 22h36l-3 30a4 4 0 0 1-4 3.6H21a4 4 0 0 1-4-3.6z"/>
        <path pathLength="1" d="M23 22v-4a9 9 0 0 1 18 0v4"/>
        <path pathLength="1" d="M24 36c2 5 14 5 16 0"/>
      </svg>
    </div>
    <div class="sp-word" aria-hidden="true">
      <span style="--i:0">S</span><span style="--i:1">h</span><span style="--i:2">o</span><span style="--i:3">p</span><span style="--i:4">L</span><span style="--i:5">i</span><span style="--i:6">n</span><span style="--i:7">k</span><em><span style="--i:8">M</span><span style="--i:9">E</span><span style="--i:10">G</span><span style="--i:11">A</span></em>
    </div>
    <p class="sp-tag">Opening the Mega Store…</p>
    <div class="sp-bar"></div>
  </div>
</div>

<header class="hero">
  <div class="w">
    <div class="nav"><a class="logo" href="/">ShopLink <em>Mega Store</em></a><a class="sell" href="/">Sell on ShopLink NG</a></div>
    <h1>Shop from sellers across Nigeria</h1>
    <p>Browse products from many stores in one place. Tap a product, pick what you want and send your order straight to the seller on WhatsApp.</p>
  </div>
</header>

<div class="sbar"><div class="w"><label class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Search products or stores" autocomplete="off" autocorrect="off" enterkeyhint="search" aria-label="Search products or stores">
  <button class="qx" id="qx" type="button" aria-label="Clear search" hidden>×</button>
</label></div></div>

<main class="w">
  <p class="st" id="st" role="status"></p>
  <div class="grid" id="g"></div>
  <button class="more" id="more" type="button" hidden>Show more</button>
  <p class="foot">ShopLink Mega Store is powered by <a href="/">ShopLink NG</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
(function () {
  var sb = window.supabase.createClient("https://grrotfpoalxvkkrkgzpg.supabase.co", "sb_publishable_rHcD1gDpdwT5jT1CscnGGA_2rV8baSw");
  var PAGE = 24, offset = 0, q = "", token = 0, failed = false, timer;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function naira(n) { return "₦" + Number(n).toLocaleString("en-NG"); }

  /* splash: stays at least 1.5s so the animation can finish */
  var t0 = Date.now();
  function hideSplash() {
    var s = $("splash"); if (!s) return;
    setTimeout(function () {
      s.classList.add("out"); document.body.classList.remove("loading");
      setTimeout(function () { s.remove(); }, 800);
    }, Math.max(0, 1500 - (Date.now() - t0)));
  }

  function card(p) {
    var href = "/" + encodeURIComponent(p.slug) + "#p=" + encodeURIComponent(p.id);
    var img = p.image_url ? '<img alt="' + esc(p.name) + '" loading="lazy" src="' + esc(p.image_url) + '">' : '<span class="ph2">' + esc(String(p.name).charAt(0).toUpperCase()) + "</span>";
    var logo = p.logo_url ? '<img alt="" loading="lazy" src="' + esc(p.logo_url) + '">' : '<span class="sl">' + esc(String(p.store_name).charAt(0).toUpperCase()) + "</span>";
    return '<a class="mc" href="' + href + '"><span class="mi">' + img + '</span><span class="mb"><span class="mn">' + esc(p.name) + '</span><span class="mp">' + naira(p.price) + '</span><span class="ms">' + logo + '<span class="nm">' + esc(p.store_name) + "</span>" + (p.verified ? '<i title="Top &amp; Trusted Seller" aria-label="Top and Trusted Seller">★</i>' : "") + "</span></span></a>";
  }

  function load(reset) {
    if (reset) { offset = 0; $("g").innerHTML = ""; }
    var my = ++token; failed = false;
    $("more").hidden = true;
    $("st").textContent = reset ? "Loading products…" : "";
    sb.rpc("mega_products", { p_q: q, p_limit: PAGE, p_offset: offset }).then(function (r) {
      if (my !== token) return;
      hideSplash();
      if (r.error) {
        failed = true; $("st").textContent = "Could not load products. Check your connection and try again.";
        $("more").textContent = "Try again"; $("more").hidden = false; return;
      }
      var rows = r.data || [];
      $("g").insertAdjacentHTML("beforeend", rows.map(card).join(""));
      offset += rows.length;
      if (!offset) {
        $("st").textContent = "";
        $("g").innerHTML = q
          ? '<div class="empty"><h2>No match found</h2><p>No product matches “' + esc(q) + '”. Try a different word.</p></div>'
          : '<div class="empty"><h2>The Mega Store is opening soon</h2><p>Sellers are adding their products. Check back shortly.</p><a href="/">Start selling on ShopLink NG</a></div>';
      } else {
        $("st").textContent = q ? offset + (offset === 1 ? " result" : "+ results") : "";
      }
      $("more").textContent = "Show more"; $("more").hidden = rows.length < PAGE;
    });
  }

  $("more").onclick = function () { load(failed && !offset); };
  $("q").addEventListener("input", function () {
    $("qx").hidden = !this.value;
    clearTimeout(timer);
    timer = setTimeout(function () { q = $("q").value.trim(); load(true); }, 300);
  });
  $("qx").onclick = function () { $("q").value = ""; this.hidden = true; q = ""; load(true); $("q").focus(); };

  load(true);
})();
</script>
</body>
</html>
